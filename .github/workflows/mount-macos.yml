name: macOS Finder build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Swift tests and embedded app build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run Finder core tests
        run: swift test --package-path native/macos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the unsigned app and embedded File Provider extension
        run: native/macos/build-app.sh build "$RUNNER_TEMP/Agent Drive.app"
