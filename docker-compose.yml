name: agent-drive

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_drive}
      POSTGRES_USER: ${POSTGRES_USER:-agent_drive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_drive_local_only}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: agent-drive/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: '${S3_ACCESS_KEY_ID:-agent_drive_local}'
      MINIO_ROOT_PASSWORD: '${S3_SECRET_ACCESS_KEY:-agent_drive_local_secret}'
      MC_HOST_local: 'http://${S3_ACCESS_KEY_ID:-agent_drive_local}:${S3_SECRET_ACCESS_KEY:-agent_drive_local_secret}@127.0.0.1:9000'
    ports:
      - '127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: agent-drive/minio:RELEASE.2025-10-15T17-29-55Z
    entrypoint: ['mc']
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET:-agent-drive-local}']
    environment:
      MC_HOST_local: 'http://${S3_ACCESS_KEY_ID:-agent_drive_local}:${S3_SECRET_ACCESS_KEY:-agent_drive_local_secret}@minio:9000'
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
