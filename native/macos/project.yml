name: Agent Drive
options:
  bundleIdPrefix: xyz.agentdrive
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    AGENTDRIVE_APP_GROUP: "$(DEVELOPMENT_TEAM).group.xyz.agentdrive.finder"
    CODE_SIGN_STYLE: Automatic
targets:
  AgentDriveFinder:
    type: application
    platform: macOS
    sources:
      - path: Sources/AgentDriveFinderCore
      - path: App
    dependencies:
      - target: AgentDriveFileProvider
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Agent Drive
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        AgentDriveAppGroup: "$(AGENTDRIVE_APP_GROUP)"
    entitlements:
      path: App/AgentDriveFinder.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(AGENTDRIVE_APP_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.agentdrive.finder
        PRODUCT_NAME: "Agent Drive"
        EXECUTABLE_NAME: AgentDriveFinder
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_ENTITLEMENTS: App/AgentDriveFinder.entitlements
  AgentDriveFileProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/AgentDriveFinderCore
      - path: Extension
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Agent Drive File Provider
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FileProviderExtension"
          NSExtensionAttributes:
            NSExtensionFileProviderSupportsEnumeration: true
            NSExtensionFileProviderDownloadPipelineDepth: 1
          NSExtensionFileProviderDocumentGroup: "$(AGENTDRIVE_APP_GROUP)"
        AgentDriveAppGroup: "$(AGENTDRIVE_APP_GROUP)"
    entitlements:
      path: Extension/FileProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - "$(AGENTDRIVE_APP_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.agentdrive.finder.fileprovider
        PRODUCT_NAME: AgentDriveFileProvider
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_ENTITLEMENTS: Extension/FileProvider.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
