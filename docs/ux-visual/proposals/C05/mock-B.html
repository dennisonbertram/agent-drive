<!doctype html><meta charset=utf-8><meta name=viewport content="width=375"><title>C05 B</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel=stylesheet>
<style>@import url(base.css);
body{padding-bottom:64px}
.drive{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border:0;border-radius:8px;background:linear-gradient(180deg,#f7f6f3,var(--al2));box-shadow:0 0 0 2px var(--sig),0 2px 6px rgba(0,0,0,.3);text-align:left}
.drive .led{width:9px;height:9px;border-radius:50%;background:var(--sig);box-shadow:0 0 9px rgba(255,90,31,.8);flex:none}
.drive span{flex:1;min-width:0}.drive b{display:block;font:500 12.5px var(--mono)}.drive small{font:400 11px var(--mono);color:var(--muted)}
.drive em{font:500 11px var(--mono);letter-spacing:.08em;font-style:normal}
.bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:0}
.bar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 10.5px var(--sans);color:var(--muted);min-width:0}
.bar button i{font-style:normal;font-size:16px}.bar .active{color:var(--ink);box-shadow:inset 0 3px 0 var(--sig)}
.sheet{position:fixed;left:0;right:0;bottom:64px;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.2);border-radius:14px 14px 0 0;padding:6px 16px 8px}
.sheet a{display:flex;align-items:center;height:48px;font-size:15px;border-bottom:1px solid var(--line)}.sheet a:last-child{border:0}
.scrim{position:fixed;inset:0 0 64px;background:rgba(18,18,17,.35)}
</style>
<div class=side style="padding-bottom:10px"><div class=brandrow><span class=brand><span class=mark>a/</span>agent drive</span><span class=avatar>T</span></div>
<button class=drive style="margin-top:10px" aria-haspopup=listbox><i class=led></i><span><b>Research workspace</b><small>5.1 KB · 3 files · drive 3 of 3</small></span><em>SWITCH ▾</em></button></div>
<div class=content><p class=eyebrow>YOUR AGENTS’ SHARED MEMORY</p><h1>Usage</h1><p class=lede>Understand what your workspace stores and serves.</p><div class=card>ENCRYPTED STORAGE<strong>5.1 KB</strong></div><div class=card>API OPERATIONS<strong>60</strong></div></div>
<div class=scrim></div>
<div class=sheet role=menu><a>Billing &amp; limits</a><a>Activity &amp; deletion</a></div>
<nav class=bar aria-label=Workspace><button><i>▤</i>Files</button><button><i>⌘</i>Agents</button><button><i>⚿</i>API keys</button><button class=active><i>▥</i>Usage</button><button><i>⌫</i>Trash</button><button><i>⋯</i>More</button></nav>
